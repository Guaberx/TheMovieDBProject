<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MoviesApp</title>
    <base href="/" />
    <meta
      name="description"
      content="Browse popular movies and actors, search titles, and see cast, ratings and similar films. Powered by TMDB."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Open the TMDB connections while the app bundle downloads. The API is fetched with CORS,
       so its connection needs crossorigin; images use a regular (credentialed) connection. -->
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
  </head>
  <body>
    <!-- Static shell shown until Angular boots and replaces it. The build inlines the CSS it needs,
       so it paints from the first few kB of HTML. Keep it in sync with shared/nav and shared/loading. -->
    <app-root>
      <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3">
        <a class="navbar-brand" href="/">MoviesApp</a>
      </nav>
      <div class="d-flex justify-content-center padtop-6 vh-100">
        <div class="spinner-border loading-spinner" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
      </div>
    </app-root>
  </body>
</html>
