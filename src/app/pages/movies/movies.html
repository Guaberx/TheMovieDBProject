@if (movies.hasValue()) {
  <div class="outer padtop-5 pb-5">
    @if (query()) {
      <h1 class="h3 text-white pt-3">Results for “{{ query() }}”</h1>
    } @else {
      <h1 class="visually-hidden">Popular movies</h1>
    }
    <div class="inner">
      @for (movie of movies.value().results; track movie.id) {
        <app-poster-card
          [imagePath]="movie.poster_path"
          [title]="movie.title"
          [rating]="movie.vote_average"
          [link]="movieLink(movie)"
        />
      } @empty {
        <p>No movies found.</p>
      }
    </div>
  </div>
} @else if (movies.error()) {
  <app-load-error (retry)="movies.reload()" />
} @else {
  <app-loading />
}
