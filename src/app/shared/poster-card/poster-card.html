@if (link(); as link) {
  <a class="poster-link" [routerLink]="link" [appPrefetch]="prefetchDetail">
    <div class="poster-frame">
      <ng-container [ngTemplateOutlet]="image" />
      @if (rating()) {
        <span class="rating-badge">
          <span aria-hidden="true">★</span>
          <span class="visually-hidden">Rating</span>
          {{ rating() | number: '1.1-1' }}
        </span>
      }
    </div>
    <span class="poster-title">{{ title() }}</span>
    @if (subtitle()) {
      <span class="poster-subtitle">{{ subtitle() }}</span>
    }
  </a>
} @else {
  <div class="poster-frame">
    <ng-container [ngTemplateOutlet]="image" />
  </div>
}

<ng-template #image>
  @if (imagePath()) {
    <!-- Linked cards show the title under the image, so their image alt stays empty.
         The big detail-page poster is the page's main content, so it gets fetched first. -->
    <img
      [src]="src()"
      [attr.srcset]="srcset()"
      [attr.sizes]="big() ? null : sizes"
      [alt]="link() ? '' : title()"
      [attr.fetchpriority]="big() ? 'high' : null"
    />
  } @else if (link()) {
    <div class="poster-placeholder" aria-hidden="true">No image</div>
  } @else {
    <div class="poster-placeholder" role="img" [attr.aria-label]="title()">No image</div>
  }
</ng-template>
