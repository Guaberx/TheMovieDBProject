@if (link(); as link) {
  <a
    [routerLink]="link"
    (pointerenter)="hoverStart()"
    (pointerleave)="hoverEnd()"
    (pointerdown)="prefetchNow()"
    (focus)="prefetchNow()"
  >
    <ng-container [ngTemplateOutlet]="image" />
    @if (rating() !== undefined) {
      <div class="text-block-top">
        <div class="h2">{{ rating() | number: '1.1-1' }}</div>
      </div>
    }
    <div class="text-block-bot">
      <p>{{ title() }}</p>
    </div>
  </a>
} @else {
  <ng-container [ngTemplateOutlet]="image" />
}

<ng-template #image>
  @if (imagePath()) {
    <!-- Linked cards repeat the title in their caption, so their image alt stays empty.
         The big detail-page poster is the page's main content, so it gets fetched first. -->
    <img
      [src]="src()"
      [attr.srcset]="srcset()"
      [attr.sizes]="big() ? null : '160px'"
      [alt]="link() ? '' : title()"
      [attr.fetchpriority]="big() ? 'high' : null"
    />
  } @else {
    <div class="poster-placeholder" role="img" [attr.aria-label]="title()">
      <span>{{ title() }}</span>
    </div>
  }
</ng-template>
